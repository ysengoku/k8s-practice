apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
spec:
  replicas: 1      # desired number of Pods
  selector:
    matchLabels:
      app: app2    # manage Pods with this label
  template:        # template of the Pods to create
    metadata:
      labels:
        app: app2  # must match the selector above
    spec:
      containers:
      - name: app2
        image: hashicorp/http-echo
        args: ["-text=Hello from app2"]
        ports:
        - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: app2
spec:
  selector:
    app: app2
  ports:
  - port: 80
    targetPort: 5678
